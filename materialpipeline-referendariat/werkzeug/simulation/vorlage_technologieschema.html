<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITEL@@ – Technologieschema</title>
<style>
  :root { --dunkel:#08349C; --gruen:#7DDE78; --an:#2E7D32; --grau:#5f6670; --nok:#C62828; }
  * { box-sizing:border-box; }
  .taste, #ein, #aus { touch-action:none; }
  body { margin:0; font-family: Arial, "Liberation Sans", sans-serif; color:#1b1f24; background:#eef1f4; }
  header { background:var(--dunkel); border-bottom:5px solid var(--gruen); color:#fff; padding:8px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header b { font-size:15px; } header span { font-size:12px; opacity:.85; }
  header .logo { background:#fff; border-radius:4px; padding:3px 6px; height:40px; display:block; }
  header .links { display:flex; align-items:center; gap:12px; }
  main { max-width:1400px; margin:0 auto; padding:12px 16px 24px; }
  .karte { background:#fff; border:1px solid #d5dae0; border-radius:6px; padding:10px 12px; margin-bottom:12px; }
  .karte h2 { font-size:14px; margin:0 0 6px; color:var(--dunkel); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .steuer button { border:2px solid var(--dunkel); color:var(--dunkel); background:#fff; padding:5px 10px; font:inherit; font-size:13px; font-weight:bold; cursor:pointer; border-radius:4px; }
  .steuer button.aktiv { background:var(--dunkel); color:#fff; }
  #status { font-weight:normal; font-size:13px; color:#1b1f24; }
  #schema svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .taste { cursor:pointer; }
  .taste .druck { fill:#000; fill-opacity:0; }
  .taste.gedrueckt .druck { fill-opacity:.35; }
  .geraet { cursor:default; }
  .klick { cursor:pointer; }
  .regler { display:flex; align-items:center; gap:10px; font-size:13px; flex-wrap:wrap; margin-top:6px; }
  .regler input[type=range]{ flex:1 1 200px; accent-color:var(--dunkel); }
  #meldung { min-height:20px; font-size:13px; font-weight:bold; color:var(--nok); margin-top:6px; }
  footer { font-size:11px; color:var(--grau); margin-top:4px; line-height:1.45; }
</style>
</head>
<body>
<header><span class="links"><img class="logo" src="@@LOGO@@" alt="Schullogo"><b>@@BETRIEB@@ · @@TITEL@@</b></span><span>@@UNTERTITEL@@ · Simulation am Technologieschema</span></header>
<main>
  <div class="karte">
    <h2><span>Technologieschema (live) <span id="status"></span></span>
      <span class="steuer"><button id="pause">⏸ Pause</button> <button id="tempo">Zeitlupe</button> <button id="neu">↺ Neustart</button></span></h2>
    <div id="schema">@@SCHEMA@@</div>
    <div class="regler"><span>Beladung Förderband (Lastmoment)</span><input type="range" id="last" min="10" max="80" step="5"><b id="lastw"></b>
      <span style="margin-left:16px">Einstellung Zeitrelais @@K1@@</span><input type="range" id="tk1" min="1" max="20" step="1"><b id="tk1w"></b></div>
    <div id="meldung"></div>
  </div>
  <footer>@@FUSS@@</footer>
</main>
<script>
@@KERN@@
const NETZ = @@NETZ@@;
const LAGE = @@LAGE@@;
const MOTOR = @@MOTOR@@;
const BED = @@BED@@;
</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const komma = (x, n) => x.toFixed(n).replace('.', ',');
const NS = "http://www.w3.org/2000/svg";
const svg = document.querySelector("#schema svg");
svg.removeAttribute("width"); svg.removeAttribute("height");
const K = 72 / 2.54, [BX0, , , BY1] = LAGE.box;
const P = (x, y) => [(x - BX0) * K, (BY1 - y) * K];          // cm im Bild → SVG-Punkte
const pts = a => a.map(([x, y]) => P(x, y).map(v => v.toFixed(2)).join(",")).join(" ");
function el(tag, attr, eltern) { const e = document.createElementNS(NS, tag); for (const k in attr) e.setAttribute(k, attr[k]); (eltern || svg).appendChild(e); return e; }

// Gurt: Querlinien auf der Oberfläche (beschnitten auf die Bandfläche), Trommeln mit Speichen
const B = LAGE.band, ex = B.tiefe * B.dx, ey = B.tiefe * B.dy;
const clip = el("clipPath", { id: "gurt" }, el("defs", {}));
el("polygon", { points: pts([[B.x0, B.y], [B.x0 + ex, B.y + ey], [B.x1 + ex, B.y + ey], [B.x1, B.y]]) }, clip);
const gurt = el("g", { "clip-path": "url(#gurt)" });
const linien = [];
for (let i = 0; i < 20; i++) linien.push(el("line", { stroke: "#9a9da2", "stroke-width": 0.6 }, gurt));
const speichen = ["umlenk", "antrieb"].map(n => {
  const [x, y, r] = LAGE[n];
  return [el("line", { stroke: "#1b1f24", "stroke-width": 1 }), el("line", { stroke: "#1b1f24", "stroke-width": 1 }), x, y, r * 0.8];
});
// Pakete (Quader wie im Schema: Vorderseite, rechte Seite, Deckel)
const PK = LAGE.paket, pakete = PK.x.map(() => ({
  seite: el("polygon", { fill: "#96714a", stroke: "#000", "stroke-width": 0.8, "stroke-linejoin": "round" }),
  deckel: el("polygon", { fill: "#e3cbad", stroke: "#000", "stroke-width": 0.8, "stroke-linejoin": "round" }),
  vorn: el("polygon", { fill: "#C8975A", stroke: "#000", "stroke-width": 0.8, "stroke-linejoin": "round" }) }));
// Betriebsart und Drehzahl auf der Konsole des Antriebs
const [mx, my] = LAGE.anzeige;
const schild = el("rect", { rx: 4, height: 0.62 * K, width: 3.0 * K, x: P(mx, my)[0] - 1.5 * K, y: P(mx, my)[1] - 0.31 * K });
const schildText = el("text", { x: P(mx, my)[0], y: P(mx, my)[1] + 2.7, "text-anchor": "middle", fill: "#fff", "font-size": 7.5, "font-weight": "bold", "font-family": "Arial" });
// Geräte im Schaltschrank: angezogen grün, ausgelöst rot
const geraete = {};
for (const [bmk, [x, y, b, h]] of Object.entries(LAGE.geraete)) {
  const [px, py] = P(x, y + h);
  geraete[bmk] = el("rect", { x: px, y: py, width: b * K, height: h * K, rx: 2, fill: "transparent", class: "geraet" });
  geraete[bmk].appendChild(Object.assign(document.createElementNS(NS, "title"), { textContent: bmk }));
}
// Taster am Bedienkasten (halten = drücken)
const gedrueckt = new Set();
// Tastendruck zählt mindestens zwei Rechenschritte (0,2 s Simulationszeit), auch bei kurzem Antippen am Tablet
let schritte = 0;
const halteStart = {}, losgelassen = new Set();
function freigeben() {
  for (const b of [...losgelassen]) if (schritte - halteStart[b] >= 2) { gedrueckt.delete(b); losgelassen.delete(b); }
}
function halten(e, bmk, merk) {
  const ab = ev => { ev.preventDefault(); if (e.setPointerCapture && ev.pointerId !== undefined) try { e.setPointerCapture(ev.pointerId); } catch (_) {}
    gedrueckt.add(bmk); halteStart[bmk] = schritte; losgelassen.delete(bmk); if (merk) merk.classList.add("gedrueckt"); };
  const auf = () => { if (!gedrueckt.has(bmk)) return; losgelassen.add(bmk); if (merk) merk.classList.remove("gedrueckt"); freigeben(); };
  e.addEventListener("pointerdown", ab);
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => e.addEventListener(n, auf));
}
for (const [bmk, [x, y]] of Object.entries(LAGE.taster)) {
  const g = el("g", { class: "taste" });
  const [px, py] = P(x, y);
  el("circle", { cx: px, cy: py, r: 0.18 * K, class: "druck" }, g);
  el("circle", { cx: px, cy: py, r: 0.3 * K, fill: "transparent" }, g);
  g.appendChild(Object.assign(document.createElementNS(NS, "title"), { textContent: bmk + " drücken" }));
  halten(g, bmk, g);
}
// Motorschutzrelais: Prüftaste bzw. Rückstellen; Sicherung nach Kurzschluss wieder einschalten
geraete[BED.f2].classList.add("klick");
geraete[BED.f2].onclick = () => { if (!f2aus) { f2aus = true; meldung(BED.f2 + " von Hand ausgelöst (Prüftaste)."); } else if (mot.theta < 1) { f2aus = false; meldung(""); } };
geraete[BED.f1].classList.add("klick");
geraete[BED.f1].onclick = () => { z.ausgeloest.delete(BED.f1); meldung(""); };

// Zustand
let z, h, mot, weg, f2aus, laeuft = true, tempo = 1, letzt = { I: 0, M: 0 };
const tk1 = $("tk1"), last = $("last");
tk1.value = BED.t_k1; last.value = BED.last;
function meldung(t) { $("meldung").textContent = t; }
function start() {
  z = Kern.neu(NETZ, { [BED.k1]: +tk1.value });
  mot = { n: 0, theta: 0 }; weg = 0; f2aus = false;
  h = Kern.schritt(z); zeigen();
}
function rechnen(dt) {
  z.verz[BED.k1] = +tk1.value;
  z.betaetigt = new Set(gedrueckt);
  if (f2aus) z.betaetigt.add(BED.f2);
  h = Kern.schritt(z);
  if (h.kurzschluss) meldung("Kurzschluss " + h.kurzschluss + ": " + BED.f1 + " hat ausgelöst.");
  for (let i = 0; i < 10; i++) {
    letzt = Kern.motor(MOTOR, mot, h.modus, +last.value / 100, dt / 10);
    weg += MOTOR.v_N * mot.n / MOTOR.nN * dt / 10 * LAGE.massstab;   // Gurtweg in cm im Bild
  }
  if (mot.theta >= MOTOR.theta_aus && !f2aus) { f2aus = true; meldung(BED.f2 + " hat ausgelöst (Überlast)."); }
  z.t = Math.round((z.t + dt) * 10) / 10;
  schritte++; freigeben();
}
function zeigen() {
  // Gurtlinien und Pakete
  const s = weg;
  linien.forEach((l, i) => {
    const x = B.x0 + ((i * 0.8 + s) % 16) - 0.8;
    const [a1, b1] = P(x, B.y), [a2, b2] = P(x + ex, B.y + ey);
    Object.entries({ x1: a1, y1: b1, x2: a2, y2: b2 }).forEach(([k, v]) => l.setAttribute(k, v));
  });
  pakete.forEach((p, i) => {
    const x = PK.start + (((PK.x[i] - PK.start + s) % PK.laenge) + PK.laenge) % PK.laenge, y = PK.y;
    const tx = PK.t * B.dx, ty = PK.t * B.dy;
    p.vorn.setAttribute("points", pts([[x, y], [x + PK.b, y], [x + PK.b, y + PK.h], [x, y + PK.h]]));
    p.seite.setAttribute("points", pts([[x + PK.b, y], [x + PK.b + tx, y + ty], [x + PK.b + tx, y + PK.h + ty], [x + PK.b, y + PK.h]]));
    p.deckel.setAttribute("points", pts([[x, y + PK.h], [x + tx, y + PK.h + ty], [x + PK.b + tx, y + PK.h + ty], [x + PK.b, y + PK.h]]));
    const rand = Math.min(x - PK.start, PK.start + PK.laenge - x);
    const o = Math.max(0, Math.min(1, rand / 0.5));                 // am Bandanfang und -ende ein- und ausblenden
    [p.vorn, p.seite, p.deckel].forEach(e => e.setAttribute("opacity", o));
  });
  speichen.forEach(([l1, l2, x, y, r]) => {
    const w = -s / LAGE.antrieb[2];
    [[l1, w], [l2, w + Math.PI / 2]].forEach(([l, a]) => {
      const [x1, y1] = P(x - r * Math.cos(a), y - r * Math.sin(a)), [x2, y2] = P(x + r * Math.cos(a), y + r * Math.sin(a));
      Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v));
    });
  });
  // Schaltschrank
  for (const [bmk, r] of Object.entries(geraete)) {
    let farbe = "transparent";
    if (bmk in z.an && z.an[bmk]) farbe = "rgba(125,222,120,.6)";
    if ((bmk === BED.f2 && f2aus) || z.ausgeloest.has(bmk)) farbe = "rgba(198,40,40,.45)";
    r.setAttribute("fill", farbe);
  }
  schild.setAttribute("fill", { Stern: "#E08A00", Dreieck: "#08349C", Aus: "#5f6670" }[h.modus] || "#C62828");
  schildText.textContent = h.modus + " · " + Math.round(mot.n) + " 1/min";
  const k1 = z.an[BED.k1] && z.seit[BED.k1] !== null ? Math.min(z.t - z.seit[BED.k1], +tk1.value) : 0;
  $("status").textContent = "· t = " + komma(z.t, 1) + " s · Band " + komma(MOTOR.v_N * mot.n / MOTOR.nN, 2) + " m/s · " +
    BED.k1 + " " + (z.an[BED.k1] ? komma(k1, 1) + " von " + tk1.value + " s" : "aus");
  $("lastw").textContent = last.value + " % von M_N"; $("tk1w").textContent = tk1.value + " s";
}
let alt = null, rest = 0;
function lauf(jetzt) {
  if (alt !== null && laeuft) {
    rest += Math.min(0.25, (jetzt - alt) / 1000) * tempo;
    while (rest >= 0.1) { rechnen(0.1); rest -= 0.1; }
    zeigen();
  }
  alt = jetzt; requestAnimationFrame(lauf);
}
$("pause").onclick = () => { laeuft = !laeuft; $("pause").textContent = laeuft ? "⏸ Pause" : "▶ Weiter"; };
$("tempo").onclick = () => { tempo = tempo === 1 ? 0.25 : 1; $("tempo").classList.toggle("aktiv", tempo < 1); };
$("neu").onclick = () => { meldung(""); start(); };
tk1.oninput = last.oninput = () => zeigen();
window.vorspulen = (bis) => { start(); while (z.t < bis - 1e-9) { if (z.t < 0.5) gedrueckt.add(BED.ein); else gedrueckt.delete(BED.ein); rechnen(0.1); } zeigen(); laeuft = false; };
window.modus = () => h.modus;
start();
requestAnimationFrame(lauf);
</script>
</body>
</html>
